# Local Postgres for development: docker compose up -d
services:
  db:
    build: ./db
    image: circuit-postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-circuit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-circuit}
      POSTGRES_DB: ${POSTGRES_DB:-circuit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
